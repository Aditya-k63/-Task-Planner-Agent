<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Planner Agent</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --muted: #7a7a8a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00b894;
    --red: #e17055;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .header .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
  }
  .header h1 { font-size: 16px; font-weight: 600; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-user {
    display: flex;
    justify-content: flex-end;
  }
  .msg-user .bubble {
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    border-radius: 16px 16px 4px 16px;
    font-size: 14px;
    font-weight: 500;
    max-width: 80%;
  }

  .msg-agent {
    display: flex;
    justify-content: flex-start;
  }
  .msg-agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 16px 16px 16px 4px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 80%;
    color: var(--text);
  }

  .msg-thinking .bubble {
    color: var(--muted);
    font-style: italic;
    font-size: 13px;
  }

  .clarify-bubble {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    max-width: 500px;
  }
  .clarify-q {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .clarify-ctx {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }
  .clarify-options { display: flex; flex-direction: column; gap: 8px; }
  .clarify-opt {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    font-size: 13px;
  }
  .clarify-opt:hover {
    border-color: var(--accent);
    background: rgba(108, 92, 231, 0.1);
  }
  .clarify-opt .opt-id {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .clarify-opt .opt-label { font-weight: 600; }
  .clarify-opt .opt-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .clarify-custom {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .clarify-custom input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .clarify-custom input:focus { border-color: var(--accent); }
  .clarify-custom button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .clarify-custom button:hover { opacity: 0.85; }

  .input-bar {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .input-row input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .input-row button:hover { opacity: 0.85; }
  .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">TP</div>
  <h1>Task Planner Agent</h1>
</div>

<div class="chat" id="chat">
  <div class="msg msg-agent">
    <div class="bubble">Hi! What would you like me to help with?</div>
  </div>
</div>

<div class="input-bar">
  <div class="input-row">
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
let sessionId = null;
let polling = null;
let awaitingClarify = false;
let resultShown = false;
const API_KEY = 'dev-key';

function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY } };
  if (body) opts.body = JSON.stringify(body);
  return fetch(path, opts).then(r => r.json());
}

function addMsg(cls, html) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = '<div class="bubble">' + html + '</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addUserMsg(text) {
  addMsg('msg-user', text);
}

function addAgentMsg(text) {
  addMsg('msg-agent', text);
}

function addThinking(text) {
  return addMsg('msg-thinking msg-agent', text);
}

function addClarify(data) {
  awaitingClarify = true;
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg msg-agent';
  div.innerHTML = `<div class="clarify-bubble">
    <div class="clarify-q">${data.question}</div>
    ${data.context ? '<div class="clarify-ctx">' + data.context + '</div>' : ''}
    <div class="clarify-options">
      ${data.options.map(o => `<div class="clarify-opt" onclick="answer('${o.id}')">
        <div class="opt-id">${o.id}</div>
        <div><div class="opt-label">${o.label}</div><div class="opt-desc">${o.description}</div></div>
      </div>`).join('')}
    </div>
    <div class="clarify-custom">
      <input type="text" id="clarifyInput" placeholder="Or type your own answer..." onkeydown="if(event.key==='Enter')sendCustom()" />
      <button onclick="sendCustom()">Send</button>
    </div>
  </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showResult(data) {
  if (resultShown) return;
  const history = data.execution_history || [];
  let answer = '';
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].action === 'completed' && history[i].output) {
      answer = history[i].output;
      break;
    }
  }
  if (answer) {
    resultShown = true;
    addAgentMsg(answer);
  }
}

function update(data) {
  if (data.error) addAgentMsg('Error: ' + data.error);

  if (data.phase === 'done') {
    showResult(data);
    stopPoll();
  }
  if (data.phase === 'error') stopPoll();

  if (data.pending_clarification) {
    addClarify(data.pending_clarification);
  }
}

async function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  resultShown = false;
  document.getElementById('sendBtn').disabled = true;
  const think = addThinking('Thinking...');

  try {
    if (awaitingClarify && sessionId) {
      awaitingClarify = false;
      const data = await api('POST', '/clarify', { session_id: sessionId, answer: text });
      think.remove();
      update(data);
    } else {
      const data = await api('POST', '/start', { goal: text });
      sessionId = data.id;
      think.remove();
      update(data);
      startPoll();
    }
  } catch (e) {
    think.remove();
    addAgentMsg('Something went wrong. Try again.');
  }
  document.getElementById('sendBtn').disabled = false;
}

async function answer(id) {
  if (!sessionId) return;
  awaitingClarify = false;
  addUserMsg(id);
  const think = addThinking('Working on it...');
  try {
    const data = await api('POST', '/clarify', { session_id: sessionId, answer: id });
    think.remove();
    update(data);
  } catch (e) {
    think.remove();
    addAgentMsg('Something went wrong. Try again.');
  }
}

function sendCustom() {
  const input = document.getElementById('clarifyInput');
  if (!input) return;
  const text = input.value.trim();
  if (text) answer(text);
}

async function poll() {
  if (!sessionId) return;
  try {
    const data = await api('GET', `/status/${sessionId}`);
    update(data);
  } catch (e) {}
}

function startPoll() {
  stopPoll();
  polling = setInterval(poll, 2000);
}

function stopPoll() {
  if (polling) { clearInterval(polling); polling = null; }
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
