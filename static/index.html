<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Planner Agent</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --muted: #7a7a8a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --blue: #74b9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* --- Header --- */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .header .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* --- Layout --- */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  /* --- Goal Input --- */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .input-section label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .goal-row {
    display: flex;
    gap: 12px;
  }
  .goal-row input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .goal-row input:focus { border-color: var(--accent); }
  .goal-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .goal-row button:hover { opacity: 0.85; }
  .goal-row button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Status Bar --- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.active { background: var(--green); animation: pulse 1.5s infinite; }
  .status-dot.error { background: var(--red); }
  .status-dot.done { background: var(--green); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* --- Task List --- */
  .tasks-section { margin-bottom: 24px; }
  .tasks-section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: border-color 0.2s;
  }
  .task-card.active { border-color: var(--accent); }
  .task-card.completed { border-color: var(--green); opacity: 0.7; }
  .task-card.failed { border-color: var(--red); opacity: 0.7; }
  .task-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
    color: var(--muted);
  }
  .task-card.active .task-num { background: var(--accent); color: #fff; border-color: var(--accent); }
  .task-card.completed .task-num { background: var(--green); color: #fff; border-color: var(--green); }
  .task-card.failed .task-num { background: var(--red); color: #fff; border-color: var(--red); }
  .task-info { flex: 1; }
  .task-desc { font-size: 14px; font-weight: 500; }
  .task-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .task-result {
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  /* --- Clarification Card --- */
  .clarify-section {
    margin-bottom: 24px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .clarify-card {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 14px;
    overflow: hidden;
  }
  .clarify-header {
    background: linear-gradient(135deg, var(--accent), #5a4bd1);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .clarify-header .icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .clarify-header .title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .clarify-body { padding: 20px; }
  .clarify-question {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .clarify-context {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  /* --- Options --- */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    text-align: left;
  }
  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(108, 92, 231, 0.08);
    transform: translateY(-1px);
  }
  .option-btn:active {
    transform: translateY(0);
  }
  .option-id {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .option-content { flex: 1; }
  .option-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .option-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* --- Custom Answer --- */
  .custom-answer {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .custom-answer input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .custom-answer input:focus { border-color: var(--accent); }
  .custom-answer button {
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* --- History --- */
  .history-section {
    margin-top: 24px;
  }
  .history-section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .history-item .tool-tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--blue);
    margin-right: 8px;
  }
  .history-item .output {
    margin-top: 6px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    max-height: 100px;
    overflow: auto;
  }

  /* --- Empty State --- */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

  /* --- Error --- */
  .error-banner {
    background: rgba(225, 112, 85, 0.1);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    color: var(--red);
    font-size: 14px;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    .goal-row { flex-direction: column; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">TP</div>
  <h1>Task Planner Agent</h1>
  <div class="badge">LangGraph + FastAPI</div>
</div>

<div class="container">
  <!-- Goal Input -->
  <div class="input-section">
    <label>Goal</label>
    <div class="goal-row">
      <input type="text" id="goalInput" placeholder="e.g. Build a REST API with auth, database, and tests" />
      <button id="startBtn" onclick="startSession()">Plan & Execute</button>
    </div>
  </div>

  <!-- Status -->
  <div id="statusBar" class="status-bar" style="display:none">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initializing...</span>
  </div>

  <!-- Error -->
  <div id="errorBanner" class="error-banner" style="display:none"></div>

  <!-- Tasks -->
  <div id="tasksSection" class="tasks-section" style="display:none">
    <h2>Tasks</h2>
    <div id="taskList"></div>
  </div>

  <!-- Clarification -->
  <div id="clarifySection" class="clarify-section" style="display:none">
    <div class="clarify-card">
      <div class="clarify-header">
        <div class="icon">?</div>
        <div class="title">Clarification Needed</div>
      </div>
      <div class="clarify-body">
        <div class="clarify-question" id="clarifyQuestion"></div>
        <div class="clarify-context" id="clarifyContext"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="custom-answer">
          <input type="text" id="customAnswer" placeholder="Or type your own answer..." />
          <button onclick="submitCustomAnswer()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Execution History -->
  <div id="historySection" class="history-section" style="display:none">
    <h2>Execution Log</h2>
    <div id="historyList"></div>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state">
    <div class="icon">🧠</div>
    <h3>Enter a goal to get started</h3>
    <p>The agent will break it into tasks, execute them, and ask for clarification when needed.</p>
  </div>
</div>

<script>
let currentSessionId = null;
let pollingInterval = null;

const API_KEY = 'dev-key';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

function setStatus(text, type) {
  const bar = document.getElementById('statusBar');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  bar.style.display = 'flex';
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.style.display = 'block';
  el.textContent = msg;
}

function renderTasks(tasks, currentId) {
  const section = document.getElementById('tasksSection');
  const list = document.getElementById('taskList');
  if (!tasks || tasks.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = tasks.map((t, i) => {
    let cls = '';
    if (t.id === currentId) cls = 'active';
    else if (t.status === 'completed') cls = 'completed';
    else if (t.status === 'failed') cls = 'failed';
    const statusIcon = t.status === 'completed' ? '✓' : t.status === 'failed' ? '✗' : (i + 1);
    return `<div class="task-card ${cls}">
      <div class="task-num">${statusIcon}</div>
      <div class="task-info">
        <div class="task-desc">${t.description}</div>
        <div class="task-meta">${t.priority} priority · ${t.status} ${t.dependencies.length ? '· deps: ' + t.dependencies.join(', ') : ''}</div>
        ${t.result ? '<div class="task-result">' + t.result + '</div>' : ''}
        ${t.error ? '<div class="task-result" style="color:var(--red)">' + t.error + '</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

function renderClarification(data) {
  const section = document.getElementById('clarifySection');
  if (!data || !data.pending) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('clarifyQuestion').textContent = data.question;
  document.getElementById('clarifyContext').textContent = data.context;
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = data.options.map(o =>
    `<div class="option-btn" onclick="submitAnswer('${o.id}')">
      <div class="option-id">${o.id}</div>
      <div class="option-content">
        <div class="option-label">${o.label}</div>
        <div class="option-desc">${o.description}</div>
      </div>
    </div>`
  ).join('');
  document.getElementById('customAnswer').value = '';
}

function renderHistory(history) {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (!history || history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = history.map(h =>
    `<div class="history-item">
      <span class="tool-tag">${h.tool || h.action}</span>
      ${h.input ? '<span>→ ' + h.input.substring(0, 80) + '</span>' : ''}
      ${h.output ? '<div class="output">' + h.output.substring(0, 300) + '</div>' : ''}
    </div>`
  ).join('');
}

function updateUI(data) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorBanner').style.display = 'none';

  if (data.error) showError(data.error);

  const phase = data.phase || 'idle';
  const phaseLabels = {
    idle: 'Ready', planning: 'Planning tasks...', executing: 'Executing...',
    clarifying: 'Waiting for your input...', reviewing: 'Reviewing...',
    done: 'All tasks completed!', error: 'Error occurred'
  };
  const phaseType = { idle: '', planning: 'active', executing: 'active', clarifying: 'active', reviewing: 'active', done: 'done', error: 'error' };
  setStatus(phaseLabels[phase] || phase, phaseType[phase] || '');

  renderTasks(data.tasks, data.current_task_id);
  renderClarification(data.pending_clarification ? { pending: true, ...data.pending_clarification } : null);
  renderHistory(data.execution_history);
}

async function startSession() {
  const goal = document.getElementById('goalInput').value.trim();
  if (!goal) return;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('emptyState').style.display = 'none';
  setStatus('Planning tasks...', 'active');

  try {
    const data = await api('POST', '/start', { goal });
    currentSessionId = data.id;
    updateUI(data);
    startPolling();
  } catch (e) {
    showError('Failed to start: ' + e.message);
    setStatus('Error', 'error');
  }
  document.getElementById('startBtn').disabled = false;
}

async function submitAnswer(answer) {
  if (!currentSessionId) return;
  setStatus('Processing your answer...', 'active');
  document.getElementById('clarifySection').style.display = 'none';
  try {
    const data = await api('POST', '/clarify', { session_id: currentSessionId, answer });
    updateUI(data);
  } catch (e) {
    showError('Failed to submit answer: ' + e.message);
  }
}

function submitCustomAnswer() {
  const input = document.getElementById('customAnswer');
  const answer = input.value.trim();
  if (answer) submitAnswer(answer);
}

document.getElementById('customAnswer').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitCustomAnswer();
});

async function pollStatus() {
  if (!currentSessionId) return;
  try {
    const data = await api('GET', `/status/${currentSessionId}`);
    updateUI(data);
    if (data.phase === 'done' || data.phase === 'error') stopPolling();
  } catch (e) { /* ignore */ }
}

function startPolling() {
  stopPolling();
  pollingInterval = setInterval(pollStatus, 2000);
}

function stopPolling() {
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
}

// Handle Enter key on goal input
document.getElementById('goalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startSession();
});
</script>
</body>
</html>
