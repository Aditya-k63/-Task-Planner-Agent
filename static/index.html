<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Planner Agent</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --muted: #7a7a8a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00b894;
    --red: #e17055;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
  }
  .header .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .header .badge {
    margin-left: auto;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(108, 92, 231, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 28px;
  }
  .input-section label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .goal-row { display: flex; gap: 12px; }
  .goal-row input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
  }
  .goal-row input:focus { border-color: var(--accent); }
  .goal-row button {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .goal-row button:hover { opacity: 0.85; }
  .goal-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 28px;
    font-size: 13px;
    font-weight: 500;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.active {
    background: var(--green);
    animation: pulse 1.5s infinite;
  }
  .status-dot.done { background: var(--green); }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .clarify-section {
    margin-bottom: 28px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .clarify-card {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 16px;
    overflow: hidden;
  }
  .clarify-header {
    background: linear-gradient(135deg, var(--accent), #5a4bd1);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .clarify-header .icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .clarify-header .title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .clarify-body { padding: 24px; }
  .clarify-question {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .clarify-context {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    line-height: 1.6;
  }
  .options-grid { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    text-align: left;
  }
  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(108, 92, 231, 0.1);
    transform: translateY(-1px);
  }
  .option-btn:active { transform: translateY(0); }
  .option-id {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .option-content { flex: 1; }
  .option-label { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .option-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .custom-answer { margin-top: 16px; display: flex; gap: 10px; }
  .custom-answer input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .custom-answer input:focus { border-color: var(--accent); }
  .custom-answer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .custom-answer button:hover { opacity: 0.85; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 64px; margin-bottom: 20px; opacity: 0.4; }
  .empty-state h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
  .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; }

  .error-banner {
    background: rgba(225, 112, 85, 0.12);
    border: 1.5px solid var(--red);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
    color: var(--red);
    font-size: 14px;
  }
  @media (max-width: 600px) {
    .container { padding: 20px 16px; }
    .goal-row { flex-direction: column; }
    .goal-row button { width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">TP</div>
  <h1>Task Planner Agent</h1>
  <div class="badge">LangGraph + FastAPI</div>
</div>

<div class="container">
  <div class="input-section">
    <label>Goal</label>
    <div class="goal-row">
      <input type="text" id="goalInput" placeholder="e.g. Build a REST API with auth, database, and tests" />
      <button id="startBtn" onclick="startSession()">Plan & Execute</button>
    </div>
  </div>

  <div id="statusBar" class="status-bar" style="display:none">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initializing...</span>
  </div>

  <div id="errorBanner" class="error-banner" style="display:none"></div>

  <div id="clarifySection" class="clarify-section" style="display:none">
    <div class="clarify-card">
      <div class="clarify-header">
        <div class="icon">?</div>
        <div class="title">Clarification Needed</div>
      </div>
      <div class="clarify-body">
        <div class="clarify-question" id="clarifyQuestion"></div>
        <div class="clarify-context" id="clarifyContext"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="custom-answer">
          <input type="text" id="customAnswer" placeholder="Or type your own answer..." />
          <button onclick="submitCustomAnswer()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="icon">🧠</div>
    <h3>Enter a goal to get started</h3>
    <p>The agent will break it into tasks, execute them, and ask for clarification when needed.</p>
  </div>
</div>

<script>
let currentSessionId = null;
let pollingInterval = null;
const API_KEY = 'dev-key';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

function setStatus(text, type) {
  document.getElementById('statusBar').style.display = 'flex';
  document.getElementById('statusDot').className = 'status-dot ' + type;
  document.getElementById('statusText').textContent = text;
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.style.display = 'block';
  el.textContent = msg;
}

function renderClarification(data) {
  const section = document.getElementById('clarifySection');
  if (!data || !data.pending) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('clarifyQuestion').textContent = data.question;
  document.getElementById('clarifyContext').textContent = data.context;
  document.getElementById('optionsGrid').innerHTML = data.options.map(o =>
    `<div class="option-btn" onclick="submitAnswer('${o.id}')">
      <div class="option-id">${o.id}</div>
      <div class="option-content">
        <div class="option-label">${o.label}</div>
        <div class="option-desc">${o.description}</div>
      </div>
    </div>`
  ).join('');
  document.getElementById('customAnswer').value = '';
}

function updateUI(data) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorBanner').style.display = 'none';

  if (data.error) showError(data.error);

  const phase = data.phase || 'idle';
  const labels = {
    idle: 'Ready', planning: 'Thinking...', executing: 'Working...',
    clarifying: 'Waiting for your input...', reviewing: 'Checking...',
    done: 'Done!', error: 'Error'
  };
  const types = { idle: '', planning: 'active', executing: 'active', clarifying: 'active', reviewing: 'active', done: 'done', error: 'error' };
  setStatus(labels[phase] || phase, types[phase] || '');

  renderClarification(data.pending_clarification ? { pending: true, ...data.pending_clarification } : null);
}

async function startSession() {
  const goal = document.getElementById('goalInput').value.trim();
  if (!goal) return;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('clarifySection').style.display = 'none';
  setStatus('Thinking...', 'active');

  try {
    const data = await api('POST', '/start', { goal });
    currentSessionId = data.id;
    updateUI(data);
    startPolling();
  } catch (e) {
    showError('Failed to start: ' + e.message);
    setStatus('Error', 'error');
  }
  document.getElementById('startBtn').disabled = false;
}

async function submitAnswer(answer) {
  if (!currentSessionId) return;
  setStatus('Working on it...', 'active');
  document.getElementById('clarifySection').style.display = 'none';
  try {
    const data = await api('POST', '/clarify', { session_id: currentSessionId, answer });
    updateUI(data);
  } catch (e) {
    showError('Failed: ' + e.message);
  }
}

function submitCustomAnswer() {
  const input = document.getElementById('customAnswer');
  const answer = input.value.trim();
  if (answer) submitAnswer(answer);
}

document.getElementById('customAnswer').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitCustomAnswer();
});

async function pollStatus() {
  if (!currentSessionId) return;
  try {
    const data = await api('GET', `/status/${currentSessionId}`);
    updateUI(data);
    if (data.phase === 'done' || data.phase === 'error') stopPolling();
  } catch (e) { /* ignore */ }
}

function startPolling() {
  stopPolling();
  pollingInterval = setInterval(pollStatus, 2000);
}

function stopPolling() {
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
}

document.getElementById('goalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startSession();
});
</script>
</body>
</html>
